<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Conciliação Ofra 2025</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Conciliação Ofra 2025</h1>
      <p class="subtitle">Movelmar SP — Balanço Financeiro</p>
    </header>

    <nav class="nav">
      <a href="index.html" class="active">📊 Dashboard</a>
      <a href="contratos.html">📄 Contratos</a>
      <button class="btn-add" id="btn-novo-lancamento">+ Novo</button>
    </nav>

    <div class="cards">
      <div class="card credito">
        <span class="card-label">Total Créditos</span>
        <span class="card-value" id="total-creditos">R$ 0,00</span>
        <span class="card-count" id="count-creditos">0 lançamentos</span>
      </div>
      <div class="card debito">
        <span class="card-label">Total Débitos</span>
        <span class="card-value" id="total-debitos">R$ 0,00</span>
        <span class="card-count" id="count-debitos">0 lançamentos</span>
      </div>
      <div class="card saldo">
        <span class="card-label">Saldo</span>
        <span class="card-value" id="saldo">R$ 0,00</span>
        <span class="card-status" id="saldo-status"></span>
      </div>
    </div>

    <div class="toolbar">
      <select id="filter-categoria" title="Categoria">
        <option value="">Categoria</option>
      </select>
      <select id="filter-tipo" title="Tipo">
        <option value="">Tipo</option>
        <option value="credito">Créditos</option>
        <option value="debito">Débitos</option>
      </select>
      <select id="filter-fornecedor" title="Fornecedor">
        <option value="">Fornecedor</option>
      </select>
    </div>

    <div class="table-container">
      <table id="tabela-lancamentos">
        <thead>
          <tr>
            <th>Data</th>
            <th class="hidden">Tipo</th>
            <th>Valor</th>
            <th>Categoria</th>
            <th>Parte</th>
            <th>Fornecedor</th>
            <th>Descrição</th>
          </tr>
        </thead>
        <tbody id="tbody-lancamentos">
          <tr>
            <td colspan="6" class="loading">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>
      <p>Atualizado em: <span id="last-update">--</span></p>
    </footer>
  </div>

  <!-- Modal Novo Lançamento -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Novo Lançamento</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="form-lancamento">
        <div class="form-group">
          <label for="input-data">Data</label>
          <input type="date" id="input-data" required>
        </div>
        <div class="form-group">
          <label for="input-tipo">Tipo</label>
          <select id="input-tipo" required>
            <option value="credito">Crédito</option>
            <option value="debito">Débito</option>
          </select>
        </div>
        <div class="form-group">
          <label for="input-valor">Valor (R$)</label>
          <input type="number" id="input-valor" step="0.01" min="0" placeholder="0,00" required>
        </div>
        <div class="form-group">
          <label for="input-categoria">Categoria</label>
          <input type="text" id="input-categoria" placeholder="Ex: financeira, imovel, fundo_comercio">
        </div>
        <div class="form-group">
          <label for="input-parte">Parte</label>
          <input type="text" id="input-parte" placeholder="Ex: Santander, Cliente, Fornecedor">
        </div>
        <div class="form-group">
          <label for="input-fornecedor">Fornecedor</label>
          <input type="text" id="input-fornecedor" placeholder="Ex: Daniel Castro, Santander">
        </div>
        <div class="form-group">
          <label for="input-descricao">Descrição</label>
          <input type="text" id="input-descricao" placeholder="Descrição do lançamento">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-delete" id="btn-delete" style="display:none">Excluir</button>
          <button type="button" class="btn-cancel" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
